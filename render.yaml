# Render 蓝图：后端服务。静态站由 GitHub Pages 从 main 分支构建，两段独立。
# 部署步骤见 docs/deployment.md。
services:
  - type: web
    name: advisor-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-dev.txt
    startCommand: uvicorn advisor.web.api:app --app-dir src --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      - key: ADVISOR_CORS_ORIGINS
        sync: false
        description: 允许跨域的前端来源，逗号分隔；留空表示不同源不开放
      - key: PYTHON_VERSION
        value: "3.12"
