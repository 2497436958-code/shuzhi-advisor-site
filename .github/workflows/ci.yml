name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; elif [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Check whitespace
        run: git diff --check

      - name: Verify criteria layer
        run: python scripts/verify_criteria.py

      - name: Run Python tests
        run: python -m unittest discover -s tests -v

      - name: Check reasoning layer parity with published results
        run: python scripts/compare_precomputed.py

      - name: Check knowledge library
        run: python scripts/check_knowledge_port.py

      - name: Check frontend syntax
        run: node --check app.js

      - name: Check knowledge page rendering
        run: node scripts/check_knowledge_page.mjs
